volumes:
  postgres_data: {}
  rustfs_data: {}
services:
  aidbox_db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker:delegated
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: aidbox
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aidbox
      POSTGRES_PASSWORD: M3ya7uZxdJ
  aidbox:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pull_policy: always
    image: healthsamurai/aidboxone:edge
    depends_on:
      - aidbox_db
    ports:
      - 8888:8888
    volumes:
      - ./init-bundle.json:/init-bundle/init-bundle.json:ro
    environment:
      AIDBOX_TERMINOLOGY_SERVICE_BASE_URL: https://tx.fhir.org/r4
      AIDBOX_FHIR_PACKAGES: hl7.fhir.r4.core#4.0.1
      AIDBOX_FHIR_SCHEMA_VALIDATION: true
      AIDBOX_CREATED_AT_URL: https://aidbox.app/ex/createdAt
      AIDBOX_CLIENT_SECRET: secret
      AIDBOX_CORRECT_AIDBOX_FORMAT: true
      AIDBOX_ADMIN_PASSWORD: cwSgexVsRb
      AIDBOX_COMPLIANCE: enabled
      BOX_SEARCH_FHIR__COMPARISONS: true
      PGHOST: aidbox_db
      BOX_COMPATIBILITY_VALIDATION_JSON__SCHEMA_REGEX: "#{:fhir-datetime}"
      BOX_SEARCH_AUTHORIZE_INLINE_REQUESTS: true
      PGUSER: aidbox
      AIDBOX_PORT: 8888
      PGDATABASE: aidbox
      PGPASSWORD: M3ya7uZxdJ
      PGPORT: "5432"
      BOX_SEARCH_INCLUDE_CONFORMANT: true
      BOX_INIT_BUNDLE: file:///init-bundle/init-bundle.json

  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_VOLUMES=/data
      - RUSTFS_CONSOLE_ENABLE=true

  # Creates "mybucket" (presigned URLs, with CORS for the front-end at localhost:3000)
  # and "offload" (Binary.data offloaded by Aidbox, never reached by the browser).
  createbucket:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - rustfs
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      s3='aws --endpoint-url http://rustfs:9000 s3api';
      until $$s3 list-buckets > /dev/null; do sleep 1; done;
      $$s3 create-bucket --bucket mybucket || true;
      $$s3 create-bucket --bucket offload || true;
      $$s3 put-bucket-cors --bucket mybucket --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:3000\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\"],\"AllowedHeaders\":[\"*\"]}]}';
      exit 0"

  # Front-end at http://localhost:3000. It runs in the browser, so it calls Aidbox and RustFS
  # through their published ports on localhost.
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - aidbox
