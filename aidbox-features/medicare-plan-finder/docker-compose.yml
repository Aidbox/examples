volumes:
  postgres_data: {}
  rustfs_data: {}

services:
  aidbox_db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker:delegated
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: aidbox
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aidbox
      POSTGRES_PASSWORD: jcRsTCRWqi

  aidbox:
    image: healthsamurai/aidboxone:edge
    depends_on:
      - aidbox_db
      - createbucket
    ports:
      - 8888:8888
    volumes:
      - ./init-bundle.json:/init-bundle/init-bundle.json:ro
    environment:
      BOX_LICENSE: ${AIDBOX_LICENSE}
      AIDBOX_PORT: 8888
      AIDBOX_BASE_URL: http://aidbox:8888
      AIDBOX_ADMIN_PASSWORD: secret
      AIDBOX_CLIENT_SECRET: secret
      PGHOST: aidbox_db
      PGPORT: "5432"
      PGUSER: aidbox
      PGPASSWORD: jcRsTCRWqi
      PGDATABASE: aidbox
      AIDBOX_FHIR_PACKAGES: hl7.fhir.r4.core#4.0.1:hl7.fhir.us.davinci-pdex-plan-net#1.1.0
      AIDBOX_FHIR_SCHEMA_VALIDATION: true
      BOX_FHIR_TERMINOLOGY_ENGINE: hybrid
      BOX_FHIR_TERMINOLOGY_ENGINE_HYBRID_EXTERNAL_TX_SERVER: https://tx.health-samurai.io/fhir
      BOX_INIT_BUNDLE: file:///init-bundle/init-bundle.json
      BOX_FHIR_BULK_STORAGE_PROVIDER: aws
      BOX_FHIR_BULK_STORAGE_AWS_ACCOUNT: rustfs
      BOX_FHIR_BULK_STORAGE_AWS_BUCKET: provider-directory-export

  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"

  createbucket:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      s3='aws --endpoint-url http://rustfs:9000 s3api';
      until $$s3 list-buckets > /dev/null; do sleep 1; done;
      $$s3 create-bucket --bucket provider-directory-export || true;
      $$s3 create-bucket --bucket provider-directory-publish || true;
      $$s3 put-bucket-policy --bucket provider-directory-publish --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::provider-directory-publish/*\"]}]}';
      exit 0"

  export:
    image: oven/bun:1
    profiles: ["export"]
    depends_on:
      - aidbox
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AIDBOX_URL: http://aidbox:8888
      CLIENT_ID: provider-export
      CLIENT_SECRET: provider-export-secret
      PUBLISH_ACCOUNT: rustfs
      PUBLISH_BUCKET: provider-directory-publish
      PUBLIC_BASE: http://localhost:9000/provider-directory-publish
    command: bun src/main.ts
